slug: 64k-q8kv
name: 64k ctx, q8_0 KV
notes: Hosted chat config. Its llama-bench numbers match 32k-q8kv (llama-bench takes
  no -c); it is benchmarked so the hosted config has a published run.
params:
  ctx: 65536
  gpu_layers: 999
  flash_attn: 'on'
  cache_type_k: q8_0
  cache_type_v: q8_0
  batch: 2048
  ubatch: 512
  threads: 6
  n_cpu_moe: 0
  parallel: 1
  load_mode: mmap
  cache_ram_mib: 0
  extra_args:
  - --temp
  - '1.0'
  - --top-p
  - '0.95'
  - --top-k
  - '20'
  - --min-p
  - '0'
  - --presence-penalty
  - '0'
bench:
  n_prompt: 512
  n_gen: 128
  depths:
  - 0
  - 4096
  - 16384
  reps: 5
  delay_s: 3
  http_prompt_lengths:
  - 512
  - 4096
eval_overrides: {}
